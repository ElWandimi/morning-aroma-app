<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#3E2C23" />
    <meta name="google-site-verification" content="2ENbP26O-owYpsqPPFv7X5hxRgVBnEmzG6OShw49wqo" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Morning Aroma" />
    <meta property="og:description" content="Traceable, fairly-priced specialty coffee — shop by variety, learn to brew, and explore where every bag comes from." />
    <meta property="og:image" content="https://morning-aroma.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://morning-aroma.com/" />
    <link rel="canonical" href="https://morning-aroma.com/" />
    <meta property="og:site_name" content="Morning Aroma" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Morning Aroma" />
    <meta name="twitter:description" content="Traceable, fairly-priced specialty coffee — shop by variety, learn to brew, and explore where every bag comes from." />
    <meta name="twitter:image" content="https://morning-aroma.com/og-image.jpg" />
    <!-- Preconnect + preload the same fonts the app applies at runtime, so the browser's preload
         scanner starts fetching them immediately during HTML parse, in parallel with the JS
         bundle download, rather than only starting after React mounts and a useEffect fires. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The hero poster is the first meaningful visual content on the homepage, shown instantly
         while the (much larger) hero video itself downloads. Preloaded for the same reason as the
         fonts above: without this, the browser only discovers it needs this image after the JS
         bundle has downloaded, parsed, and mounted React — this lets the preload scanner fetch it
         in parallel with that instead. Not preloading the video itself deliberately: at ~450KB,
         forcing every visitor to fetch it before knowing whether they'll stay on the page isn't a
         clear win the way a ~37KB poster image is. -->
    <link rel="preload" as="image" href="/video/hero-poster.jpg" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" /></noscript>
    <style>
      /* Inline and self-contained on purpose — this must render before the app's own stylesheet
         (bundled into the JS) has loaded, so it can't depend on anything external. Removed
         automatically the instant React mounts and takes over #root, no manual cleanup needed.
         Colors matched exactly to the app's real theme (--chestnut, --espresso, --cream, --gold
         in src/styles/theme.js), not approximated, so this doesn't visually clash with what
         appears the instant the real app takes over. */
      #ma-preload {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #FDF8F0; font-family: Georgia, 'Times New Roman', serif; color: #3E2C23; gap: 18px; z-index: 9999;
      }
      #ma-preload .ma-preload-cup-wrap { position: relative; width: 76px; height: 76px; }
      #ma-preload .ma-preload-cup-wrap svg { width: 100%; height: 100%; overflow: visible; }
      #ma-preload .ma-preload-bean {
        transform-origin: center;
        animation: ma-preload-bounce 1.4s ease-in-out infinite;
      }
      #ma-preload .ma-preload-bean:nth-child(1) { animation-delay: 0s; }
      #ma-preload .ma-preload-bean:nth-child(2) { animation-delay: 0.25s; }
      #ma-preload .ma-preload-bean:nth-child(3) { animation-delay: 0.5s; }
      @keyframes ma-preload-bounce {
        0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
        15%  { opacity: 1; }
        55%  { transform: translateY(-30px) rotate(200deg); opacity: 1; }
        80%  { opacity: 0; }
        100% { transform: translateY(-30px) rotate(200deg); opacity: 0; }
      }
      #ma-preload p { margin: 0; font-size: 1.1rem; letter-spacing: 0.02em; }
      @media (prefers-reduced-motion: reduce) {
        /* A gently pulsing cup rather than a hard freeze -- a completely static loading screen
           can read as broken/frozen, which is worse than a subtle, motion-safe pulse for someone
           who's asked for reduced motion specifically, not zero visual feedback at all. */
        #ma-preload .ma-preload-bean { animation: none; opacity: 0; }
        #ma-preload .ma-preload-cup-wrap { animation: ma-preload-pulse 1.6s ease-in-out infinite; }
      }
      @keyframes ma-preload-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="ma-preload" aria-hidden="true">
        <div class="ma-preload-cup-wrap">
          <svg viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Light source from the top-left throughout, so every gradient below agrees with
                   the same imagined light and the cup reads as one consistent solid object
                   rather than flat shapes with unrelated shading pasted on. -->
              <linearGradient id="ma-preload-shadow-g" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3E2C23" stop-opacity="0.16" />
                <stop offset="100%" stop-color="#3E2C23" stop-opacity="0" />
              </linearGradient>
              <radialGradient id="ma-preload-saucer-g" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#F5E9D3" />
                <stop offset="100%" stop-color="#D8BE95" />
              </radialGradient>
              <linearGradient id="ma-preload-cup-g" x1="0" y1="0" x2="1" y2="0.3">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="45%" stop-color="#FDF8F0" />
                <stop offset="100%" stop-color="#E8D5B5" />
              </linearGradient>
              <radialGradient id="ma-preload-coffee-g" cx="38%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#A9714A" />
                <stop offset="55%" stop-color="#7A4A2E" />
                <stop offset="100%" stop-color="#5C3620" />
              </radialGradient>
              <linearGradient id="ma-preload-handle-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#A9714A" />
                <stop offset="100%" stop-color="#6B4226" />
              </linearGradient>
              <linearGradient id="ma-preload-rim-g" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
              </linearGradient>
            </defs>
            <!-- Three coffee beans, bouncing up out of the cup on a staggered loop -- given the
                 same rounded, two-tone shading as a real coffee bean (a highlight on the side
                 facing the light) rather than a single flat fill, so they read as small solid
                 objects rather than flat dots even while in motion. -->
            <g>
              <g class="ma-preload-bean">
                <ellipse cx="28" cy="30" rx="4.5" ry="6" fill="#3E2C23" />
                <ellipse cx="26.5" cy="28" rx="1.6" ry="2.4" fill="#6B4226" />
              </g>
              <g class="ma-preload-bean">
                <ellipse cx="38" cy="26" rx="4.5" ry="6" fill="#3E2C23" />
                <ellipse cx="36.5" cy="24" rx="1.6" ry="2.4" fill="#6B4226" />
              </g>
              <g class="ma-preload-bean">
                <ellipse cx="48" cy="30" rx="4.5" ry="6" fill="#3E2C23" />
                <ellipse cx="46.5" cy="28" rx="1.6" ry="2.4" fill="#6B4226" />
              </g>
            </g>
            <!-- Soft contact shadow the cup casts onto the saucer -- the single biggest cue that
                 the cup is a raised object sitting ON the saucer rather than a flat sticker lying
                 next to it. -->
            <ellipse cx="38" cy="61.5" rx="21" ry="3.5" fill="url(#ma-preload-shadow-g)" />
            <!-- Saucer -- a radial gradient (lit top-left, darker toward the rim) plus a thin
                 darker underline along its bottom edge gives it real plate-like curvature instead
                 of a flat tinted oval. -->
            <ellipse cx="38" cy="67" rx="26" ry="5" fill="#C9A876" />
            <ellipse cx="38" cy="66" rx="26" ry="5" fill="url(#ma-preload-saucer-g)" />
            <!-- Cup body -- a diagonal gradient (bright highlight top-left, warm shadow bottom-
                 right) is what actually makes a flat-drawn shape read as a rounded, lit ceramic
                 form rather than a flat cutout with a stroke around it. -->
            <path d="M14 38 L18 60 Q18 64 22 64 L54 64 Q58 64 58 60 L62 38 Z" fill="url(#ma-preload-cup-g)" stroke="#8B5A3A" stroke-width="2" stroke-linejoin="round" />
            <!-- Coffee surface -- radial gradient for a pooled-liquid look, plus a small crescent
                 highlight catching the same top-left light as everything else, so the liquid
                 reads as reflective rather than a flat brown ellipse. -->
            <ellipse cx="38" cy="38" rx="24" ry="5" fill="url(#ma-preload-coffee-g)" />
            <ellipse cx="30" cy="36.5" rx="6" ry="1.4" fill="#C89968" opacity="0.55" />
            <!-- Handle -- same diagonal light-to-shadow gradient as the cup body it's attached to,
                 so it reads as one continuous piece of ceramic rather than a separately-colored
                 loop. -->
            <path d="M62 42 Q74 42 74 50 Q74 58 62 57" fill="none" stroke="url(#ma-preload-handle-g)" stroke-width="4.5" stroke-linecap="round" />
            <!-- A thin bright rim-light tracing just inside the cup's top-left edge -- the small
                 extra detail that reads as "glazed ceramic catching the light" rather than a flat
                 outline, without needing an actual 3D renderer to get there. -->
            <path d="M15.5 40 Q16.5 44 19 56" fill="none" stroke="url(#ma-preload-rim-g)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
          </svg>
        </div>
        <p>Morning Aroma</p>
        <!-- Real, crawlable description of what this app is -- genuinely present in the raw HTML
             response the instant the page loads, not something that only exists after React
             mounts. React clears this automatically the moment it takes over #root, so a real
             visitor with JavaScript enabled never sees it linger past the loading screen; a
             crawler or automated check that reads the raw response (or a headless browser that
             errors/times out before hydration finishes) sees real content either way. -->
        <p style="max-width: 420px; font-size: 0.95rem; line-height: 1.5; margin-top: 4px;">
          Morning Aroma is an online store for specialty, ethically-sourced coffee beans and green
          coffee, offering direct-trade coffee from Kenya, Rwanda, Colombia, and other origins,
          along with brewing guides and a coffee education academy.
          <a href="/privacy" style="color: inherit;">Privacy Policy</a>
        </p>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FDF8F0;color:#3E2C23;font-family:Georgia,serif;text-align:center;padding:24px;">
        <div style="max-width: 480px;">
          <p><strong>Morning Aroma</strong> is an online store for specialty, ethically-sourced
          coffee beans and green coffee, offering direct-trade coffee from Kenya, Rwanda, Colombia,
          and other origins, along with brewing guides and a coffee education academy.</p>
          <p>This site needs JavaScript enabled to run. Please enable it in your browser settings
          and reload the page. <a href="/privacy" style="color: inherit;">Privacy Policy</a></p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
